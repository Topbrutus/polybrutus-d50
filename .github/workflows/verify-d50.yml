name: Verify Polybrutus D50 exact science and Zenodo bibliography
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  exact-d50:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact rational arithmetic
        run: python -m pip install sympy==1.14.0
      - name: Primary exact metric, affine rank and ideal graph
        run: python src/verify_d50.py
      - name: Independent Fraction based reconstruction
        run: python tests/independent_d50.py
      - name: Certificate deterministic clean tree
        run: git diff --exit-code -- results/certificate_d50.json
      - name: Mandatory current 50D Zenodo bibliography QA
        run: python src/check_zenodo_metadata.py
